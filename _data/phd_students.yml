  university: Universidad de los Andes
  expected_graduation: 2027
  cosupervisor: "David Álvarez-Martínez (Ingeniería Industrial)"
  topic: "Aprendizaje por refuerzo para la operación de sistemas energéticos distribuidos de base renovable"
  description: "Aplica algoritmos de aprendizaje por refuerzo a la operación de sistemas energéticos distribuidos de base renovable. La tesis avanza por hitos en la gestión de microrredes: la programación dinámica dual estocástica, un marco de horizonte rodante para microrredes trifásicas desbalanceadas, el aprendizaje por refuerzo (Soft Actor-Critic) con restricciones de operación y, en la etapa actual, las restricciones probabilísticas."
  keywords:
    - Deep Reinforcement Learning
    - Microgrid Energy Management
    - Three-Phase Unbalanced Systems
    - Soft Actor-Critic
    - Power Flow Optimization
  scholar: "https://scholar.google.com/citations?user=Jr8rSacAAAAJ&hl=es"
  orcid: "https://orcid.org/0009-0005-8935-196X"
  linkedin: "https://www.linkedin.com/in/pablosanabria19615411a/"

